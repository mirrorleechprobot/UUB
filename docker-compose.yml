services:
  url-uploader:
    build: .
    container_name: url-uploader-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      ADMIN_IDS: ${ADMIN_IDS:-}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID}
      DIRECT_REFERER: ${DIRECT_REFERER:-}
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      PORT: 8080
      DATA_DIR: /app/data
      COOKIE_FILE: /app/cookies.txt
      COOKIES_TEXT: ${COOKIES_TEXT:-}
      PROGRESS_UPDATE_INTERVAL: ${PROGRESS_UPDATE_INTERVAL:-10}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-}
      ARIA2_CONNECTIONS: ${ARIA2_CONNECTIONS:-}
      CONCURRENT_FRAGMENTS: ${CONCURRENT_FRAGMENTS:-}
      MAX_CONCURRENT_TRANSMISSIONS: ${MAX_CONCURRENT_TRANSMISSIONS:-}
      ARIA2_DISK_CACHE_MB: ${ARIA2_DISK_CACHE_MB:-}
      FLOOD_SLEEP_THRESHOLD: ${FLOOD_SLEEP_THRESHOLD:-600}
      FLOOD_MAX_WAIT: ${FLOOD_MAX_WAIT:-3600}
      HELPER_BOT_TOKENS: ${HELPER_BOT_TOKENS:-}
      KEEPALIVE_MINUTES: ${KEEPALIVE_MINUTES:-4}
      DISK_CLEAN_PERCENT: ${DISK_CLEAN_PERCENT:-90}
      KEEPALIVE_URL: ${KEEPALIVE_URL:-}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DB: ${MONGO_DB:-uub}
      PERSIST_SESSION: ${PERSIST_SESSION:-true}
      PIPELINE: ${PIPELINE:-true}
      QUEUE_RESTORE_MAX_AGE_H: ${QUEUE_RESTORE_MAX_AGE_H:-24}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_DAYS: ${CACHE_TTL_DAYS:-30}
      SSRF_PROTECTION: ${SSRF_PROTECTION:-true}
      DISK_MIN_FREE_MB: ${DISK_MIN_FREE_MB:-300}
      YTDLP_UPDATE_HOURS: ${YTDLP_UPDATE_HOURS:-12}
      ALERTS: ${ALERTS:-true}
      TORRENT_ENABLED: ${TORRENT_ENABLED:-true}
      TORRENT_NO_PEER_TIMEOUT: ${TORRENT_NO_PEER_TIMEOUT:-180}
      TORRENT_MAX_GB: ${TORRENT_MAX_GB:-8}
      DAILY_LIMIT_GB: ${DAILY_LIMIT_GB:-0}
      DAILY_LIMIT_FILES: ${DAILY_LIMIT_FILES:-0}
      PREMIUM_REMIND_DAYS: ${PREMIUM_REMIND_DAYS:-3,1}
      SPLIT_SIZE_MB: ${SPLIT_SIZE_MB:-1950}
      MAX_RUNNING_PER_USER: ${MAX_RUNNING_PER_USER:-1}
      MAX_WAITING_PER_USER: ${MAX_WAITING_PER_USER:-50}
      MAX_URLS_PER_MESSAGE: ${MAX_URLS_PER_MESSAGE:-50}
      PROBE_CONCURRENCY: ${PROBE_CONCURRENCY:-5}
      PLAYLIST_LIMIT: ${PLAYLIST_LIMIT:-15}
      TXT_MAX_URLS: ${TXT_MAX_URLS:-2000}
      TXT_MAX_FILE_KB: ${TXT_MAX_FILE_KB:-2048}
      TXT_RESTORE_MAX_AGE_H: ${TXT_RESTORE_MAX_AGE_H:-168}
      GALLERYDL_ENABLED: ${GALLERYDL_ENABLED:-true}
      GALLERY_MAX_FILES: ${GALLERY_MAX_FILES:-30}
      GALLERY_PROBE_TIMEOUT: ${GALLERY_PROBE_TIMEOUT:-60}
      AUDIO_SEARCH_MAX_SEC: ${AUDIO_SEARCH_MAX_SEC:-240}
      AUDIO_SEARCH_MAX_CANDIDATES: ${AUDIO_SEARCH_MAX_CANDIDATES:-6}
      AUTO_PARALLEL: ${AUTO_PARALLEL:-}
      AUTO_PARALLEL_MAX: ${AUTO_PARALLEL_MAX:-}
      AUTO_PARALLEL_TARGET_MBPS: ${AUTO_PARALLEL_TARGET_MBPS:-10}
      AUTO_PARALLEL_SLOW_MBPS: ${AUTO_PARALLEL_SLOW_MBPS:-3}
      AUTO_PARALLEL_WARMUP_SEC: ${AUTO_PARALLEL_WARMUP_SEC:-20}
      AUTO_PARALLEL_MIN_FREE_MB: ${AUTO_PARALLEL_MIN_FREE_MB:-3000}
      UPLOAD_STALL_SEC: ${UPLOAD_STALL_SEC:-240}
      UPLOAD_STALL_RETRIES: ${UPLOAD_STALL_RETRIES:-2}
      MEMORY_START_LIMIT_PCT: ${MEMORY_START_LIMIT_PCT:-85}
      MAX_FILE_GB: ${MAX_FILE_GB:-4}
      LONG_JOB_RELEASE: ${LONG_JOB_RELEASE:-true}
      LONG_JOB_MIN: ${LONG_JOB_MIN:-10}
      LONG_JOB_MAX_PARALLEL: ${LONG_JOB_MAX_PARALLEL:-3}
      LOG_MIRROR: ${LOG_MIRROR:-true}
      LOG_MIRROR_INTERVAL_SEC: ${LOG_MIRROR_INTERVAL_SEC:-15}
      CONVERT_TO_MP4: ${CONVERT_TO_MP4:-true}
      SPEED_PROFILE: ${SPEED_PROFILE:-auto}
      FORCE_SPEED: ${FORCE_SPEED:-}
      HELPER_FIRST: ${HELPER_FIRST:-true}
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./cookies.txt:/app/cookies.txt:ro
