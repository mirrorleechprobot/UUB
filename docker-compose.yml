services:
  url-uploader:
    build: .
    container_name: url-uploader-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      ADMIN_IDS: ${ADMIN_IDS:-}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID}
      DIRECT_REFERER: ${DIRECT_REFERER:-}
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      PORT: 8080
      DATA_DIR: /app/data
      COOKIE_FILE: /app/cookies.txt
      COOKIES_TEXT: ${COOKIES_TEXT:-}
      PROGRESS_UPDATE_INTERVAL: ${PROGRESS_UPDATE_INTERVAL:-10}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      ARIA2_CONNECTIONS: ${ARIA2_CONNECTIONS:-16}
      CONCURRENT_FRAGMENTS: ${CONCURRENT_FRAGMENTS:-16}
      MAX_CONCURRENT_TRANSMISSIONS: ${MAX_CONCURRENT_TRANSMISSIONS:-6}
      SPLIT_SIZE_MB: ${SPLIT_SIZE_MB:-1950}
      MAX_QUEUE_PER_USER: ${MAX_QUEUE_PER_USER:-10}
      PLAYLIST_LIMIT: ${PLAYLIST_LIMIT:-15}
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./cookies.txt:/app/cookies.txt:ro
